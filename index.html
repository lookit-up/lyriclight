<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="start-overlay">
    <div id="start-text">loading…</div>
  </div>

  <div id="flashlight-mask">
    <div id="lyrics-track">
      <div class="lyric-line placeholder">no song loaded yet</div>
    </div>
  </div>

  <div id="upload-zone">
    <button id="upload-btn" type="button">+ add your own song</button>
    <button id="clear-uploads-btn" type="button" class="secondary">clear my uploads</button>
    <input type="file" id="upload-input" accept="audio/*" multiple hidden>
  </div>

  <div id="cursor-glow"></div>

  <audio id="player" preload="auto"></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
